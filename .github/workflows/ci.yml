name: CI

# Every push and PR: the server's tests and lint, the web UI's typecheck and build, the
# iPXE builds, and an end-to-end netboot of SeaBIOS and OVMF VMs in QEMU against them.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked -p bootbob
      - uses: actions/upload-artifact@v4
        with:
          name: bootbob-debug
          path: backend/target/debug/bootbob

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  ipxe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache the build
        id: cache
        uses: actions/cache@v4
        with:
          path: ipxe-out
          key: ipxe-${{ hashFiles('ipxe/**') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential liblzma-dev gcc-aarch64-linux-gnu
          ipxe/build.sh ipxe-out
      - uses: actions/upload-artifact@v4
        with:
          name: ipxe
          path: ipxe-out

  e2e:
    needs: [backend, ipxe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bootbob-debug
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: ipxe
          path: ipxe-out
      - name: Install QEMU, OVMF and dnsmasq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dnsmasq-base jq
          # KVM when the runner offers it; the test falls back to TCG otherwise.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - run: chmod +x bin/bootbob && sudo e2e/run.sh bin/bootbob ipxe-out

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t bootbob:ci .
      - name: Smoke test
        run: |
          docker run -d --name bb -p 18067:8067 bootbob:ci
          for _ in $(seq 30); do curl -sf localhost:18067/api/status && break; sleep 1; done
          curl -sf localhost:18067/api/status | grep -q '"bootbob-efi-x64.efi"'
          curl -sf localhost:18067/ | grep -q '<div id="app">'
          docker logs bb
