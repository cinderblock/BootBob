name: CI

# Every push and PR: the server's tests and lint, the web UI's typecheck and build, the
# iPXE builds, and an end-to-end netboot of SeaBIOS and OVMF VMs in QEMU against them.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked -p bootbob
      - uses: actions/upload-artifact@v4
        with:
          name: bootbob-debug
          path: backend/target/debug/bootbob

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  ipxe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache the build
        id: cache
        uses: actions/cache@v4
        with:
          path: ipxe-out
          key: ipxe-${{ hashFiles('ipxe/**') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential liblzma-dev gcc-aarch64-linux-gnu
          ipxe/build.sh ipxe-out
      - uses: actions/upload-artifact@v4
        with:
          name: ipxe
          path: ipxe-out

  e2e:
    needs: [backend, ipxe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bootbob-debug
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: ipxe
          path: ipxe-out
      - name: Install QEMU, OVMF and dnsmasq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dnsmasq-base jq tcpdump
          # KVM when the runner offers it; the test falls back to TCG otherwise.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - run: chmod +x bin/bootbob && sudo e2e/run.sh bin/bootbob ipxe-out

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t bootbob:ci .
      - name: Smoke test
        run: |
          docker run -d --name bb -p 18067:8067 bootbob:ci
          for _ in $(seq 30); do curl -sf localhost:18067/api/status && break; sleep 1; done
          curl -sf localhost:18067/api/status | grep -q '"bootbob-efi-x64.efi"'
          curl -sf localhost:18067/ | grep -q '<div id="app">'
          docker logs bb

  # Push to master, everything green → publish the image to GHCR. Which build runs on
  # steamboat is pinned in the ops repo (servers/steamboat/stacks/bootbob/pin.json), so
  # nothing reaches a server until that pin is updated there.
  publish:
    needs: [backend, web, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # GHCR names are lowercase; the repo is cinderblock/BootBob.
      IMAGE: ghcr.io/cinderblock/bootbob
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # ops checks this label against the commit its pin names.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summarize how to deploy this build
        run: |
          {
            echo "### Image published"
            echo
            echo '```json'
            echo '{'
            echo '  "image": "${{ env.IMAGE }}",'
            echo '  "digest": "${{ steps.push.outputs.digest }}",'
            echo '  "source": {'
            echo '    "repo": "${{ github.repository }}",'
            echo '    "commit": "${{ github.sha }}"'
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo 'Paste into `servers/steamboat/stacks/bootbob/pin.json` in cinderblock/ops and push.'
            echo 'Nothing reaches the host until you do.'
          } >> "$GITHUB_STEP_SUMMARY"
