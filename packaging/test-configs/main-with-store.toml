# BootBob on steamboat. Paths not set here keep the image's defaults.
data_dir = "/var/lib/bootbob"
ipxe_dir = "/usr/share/bootbob/ipxe"
web_dir = "/usr/share/bootbob/web"

# The web UI and the management API: the LAN address, and loopback for Caddy on this host.
# Machines never need them.
[control]
http = ["10.255.0.5:8067", "127.0.0.1:8067"]
# The LAN: the network check probes it, its time zone is used, mDNS advertises there.
network = "eno1"

# Machines netboot on the LAN: the DHCP listener, TFTP, HTTP and NBD on its address
# (10.255.0.5), bound to eno1 so nothing arriving on another interface reaches them.
[[boot]]
interface = "eno1"
label = "TSL LAN"
url = "http://10.255.0.5:8067"

# Image stores: disk images named "uberfall:<disk>.img" live on uberfall's
# bootbob-store (servers/uberfall/stacks/bootbob-store). Machines reach it
# directly for NBD; this server reads their boot files from it.
[[stores]]
name = "uberfall"
url = "http://10.255.0.3:8068"
