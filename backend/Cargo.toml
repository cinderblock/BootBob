# BootBob's Rust backend: the network boot server, one statically linked binary.
#
# Crates:
#   bootbob-tftp   async read-only TFTP server (blksize, tsize, timeout, windowsize)
#   bootbob-dhcp   DHCP parsing, the passive listener, firmware arch detection
#   bootbob-ipxe   iPXE script generation (fallback menu, boot scripts)
#   bootbob-pi     Raspberry Pi boot: bootloader request paths, boot files from dirs or disk images
#   bootbob-cow    disks as files: plain images, and copy-on-write overlays over a shared base
#   bootbob-nbd    NBD server: disks as network block devices (network roots)
#   bootbob-nbd-client  the client a diskless machine runs: survives the server restarting
#   bootbob        the server binary: config, device store, resolver, HTTP API, web UI

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[workspace.dependencies]
bootbob-tftp = { path = "crates/tftp" }
bootbob-dhcp = { path = "crates/dhcp" }
bootbob-ipxe = { path = "crates/ipxe" }
bootbob-pi = { path = "crates/pi" }
bootbob-nbd = { path = "crates/nbd" }
bootbob-cow = { path = "crates/cow" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
bytes = "1"
# Reads the boot partition straight out of a Pi disk image. No chrono: we never write.
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
mdns-sd = { version = "0.21", default-features = false }
# The main server and its image stores talk plain HTTP on the LAN: no TLS stack.
ureq = { version = "3", default-features = false }
redb = "4"
# Compressed disk image uploads; pure Rust, so the build stays musl and nothing else.
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
# TCP keepalive timings for NBD connections (std only sets keepalive on or off).
socket2 = { version = "0.6", features = ["all"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["io", "io-util"] }
toml = "1"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
